<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Groove phone mic</title>
<style>
  :root { --bg:#0e0e11; --card:#1a1a1f; --line:#2a2a31; --text:#f2f3f5; --mute:#8d8e97; --rec:#ef5e4e; --ok:#4cc38a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 28rem; margin: 0 auto; padding: max(1.2rem, env(safe-area-inset-top)) 1.2rem max(1.2rem, env(safe-area-inset-bottom)); min-height: 100vh; display:flex; flex-direction:column; gap:1rem; }
  h1 { font-size: 1.15rem; margin: .4rem 0 0; font-weight: 600; letter-spacing: .01em; }
  h1 span { color: var(--mute); font-weight: 400; }
  #status { margin: 0; color: var(--mute); min-height: 1.4em; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--rec); }
  progress { width:100%; height:6px; accent-color: var(--ok); }
  .card { background: var(--card); border-radius: 16px; padding: 1rem; display:flex; flex-direction:column; gap:.8rem; }
  label { display:flex; flex-direction:column; gap:.3rem; font-size:.85rem; color:var(--mute); }
  label.check { flex-direction:row; align-items:center; gap:.6rem; color:var(--text); font-size:.9rem; }
  input[type=text], input[type=number] { background:#101013; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:.7rem .8rem; font:inherit; width:100%; }
  button { font:inherit; color:var(--text); background:#2c2c33; border:0; border-radius:14px; padding:.9rem 1rem; }
  button:disabled { opacity:.45; }
  button.primary { background: var(--ok); color:#07130d; font-weight:600; }
  button.link { background:none; color:var(--mute); padding:.4rem; text-decoration:underline; }
  #live { align-items:center; gap:1.1rem; }
  #meter { width:100%; height:10px; background:#101013; border-radius:6px; overflow:hidden; }
  #meter i { display:block; height:100%; width:0%; background:var(--ok); transition: width .08s linear; }
  #rec { width: 9.5rem; height: 9.5rem; border-radius: 50%; background: var(--rec); padding:0; position:relative; box-shadow: 0 0 0 .55rem rgba(239,94,78,.18); transition: box-shadow .2s; }
  #rec::after { content:""; position:absolute; inset: 34%; background:#fff; border-radius: 50%; transition: all .15s; }
  #rec.on { box-shadow: 0 0 0 .8rem rgba(239,94,78,.35); }
  #rec.on::after { inset: 36%; border-radius: 10px; }
  #time { font-size: 2rem; font-variant-numeric: tabular-nums; margin: 0; }
  #log { color:var(--mute); font-size:.8rem; margin:0; white-space:pre-wrap; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Groove <span>phone mic</span></h1>
  <p id="status">Loading…</p>
  <progress id="load" max="1" value="0"></progress>

  <section id="setup" class="card">
    <label>DAW address (filled in when you scan the code)
      <input id="addr" type="text" placeholder="tc…" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <label>Port
      <input id="port" type="number" inputmode="numeric" value="8765">
    </label>
    <label class="check"><input id="voiceproc" type="checkbox"> Phone voice processing (echo and noise clean-up)</label>
    <button id="connect" class="primary" disabled>Connect</button>
  </section>

  <section id="live" class="card" hidden>
    <div id="meter"><i></i></div>
    <button id="rec" aria-label="Record" disabled></button>
    <p id="time">0:00</p>
    <button id="disconnect" class="link">Disconnect</button>
  </section>

  <p id="log"></p>
</main>

<script src="wasm_exec.js"></script>
<script type="module">
// Groove phone mic. This page runs the tailcat browser build (WebAssembly), dials the DAW's tailcat address and
// streams the microphone to it. The DAW sees an ordinary byte stream; the messages are framed as
//   [1 byte type][4 bytes length, little endian][payload]
// phone -> DAW: H hello (JSON) | A audio (16-bit mono PCM) | L input level (1 byte) | R record (1 byte: 1 start, 0 stop) | Q pong
// DAW -> phone: S state (JSON {"rec":0|1}) | P ping

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const verbose = params.has("verbose");
const testTone = params.has("test") || hash.has("test");
const derpMapURL = params.get("derpmap") || "https://tailcat.dev/derpmap.json";

const setStatus = (msg, cls = "") => { const s = $("status"); s.textContent = msg; s.className = cls; };
const log = (msg) => { $("log").textContent = msg; };

// ---- load the tailcat WebAssembly build ----------------------------------------------------------------------
async function fetchWasm() {
  const gz = await fetch("main.wasm.gz");
  if (!gz.ok) throw new Error("fetching main.wasm.gz: " + gz.status);
  const size = Number(gz.headers.get("Content-Length")) || 0;
  let loaded = 0;
  const counted = gz.body.pipeThrough(new TransformStream({
    transform(chunk, controller) {
      loaded += chunk.byteLength;
      if (size) { $("load").value = loaded / size; setStatus(`Loading… ${Math.floor(100 * loaded / size)}%`); }
      controller.enqueue(chunk);
    },
  }));
  return new Response(counted.pipeThrough(new DecompressionStream("gzip")), { headers: { "Content-Type": "application/wasm" } });
}
const ready = new Promise((resolve) => { globalThis.onTailcatReady = resolve; });
const go = new Go();
WebAssembly.instantiateStreaming(fetchWasm(), go.importObject).then(({ instance }) => go.run(instance))
  .catch((e) => { setStatus("Could not load: " + e.message, "bad"); });
await ready;
$("load").remove();

// ---- the address from the QR code ---------------------------------------------------------------------------
const startAddr = hash.get("a") || params.get("a") || "";
const startPort = hash.get("p") || params.get("p") || "";
if (startAddr) $("addr").value = startAddr;
if (startPort) $("port").value = startPort;
// the address is a secret: take it out of the visible URL once it has been read
if (startAddr) history.replaceState(null, "", location.pathname + location.search);
$("connect").disabled = false;
setStatus(startAddr ? "Ready. Tap Connect." : "Paste the address from your DAW, then tap Connect.");

// ---- state ---------------------------------------------------------------------------------------------------
let conn = null, ctx = null, stream = null, proc = null, source = null;
let recording = false, recStart = 0, level = 0, lastL = 0, queued = 0, wake = null;
let sendChain = Promise.resolve();

function frame(type, payload) {
  const p = payload || new Uint8Array(0);
  const out = new Uint8Array(5 + p.length);
  out[0] = type.charCodeAt(0);
  new DataView(out.buffer).setUint32(1, p.length, true);
  out.set(p, 5);
  return out;
}
function send(type, payload) {
  if (!conn) return;
  const f = frame(type, payload);
  queued += f.length;
  const c = conn;
  sendChain = sendChain.then(() => c.write(f)).then(() => { queued -= f.length; }).catch((e) => fail(e));
}
const enc = new TextEncoder();

function setRecording(on, fromUser) {
  if (on === recording) return;
  recording = on;
  if (on) recStart = Date.now();
  $("rec").classList.toggle("on", on);
  $("rec").setAttribute("aria-label", on ? "Stop" : "Record");
  if (fromUser) send("R", Uint8Array.of(on ? 1 : 0));
  setStatus(on ? "Recording…" : "Connected to your DAW. Ready.", on ? "bad" : "ok");
}

function handle(type, p) {
  if (type === "S") {
    try { setRecording(!!JSON.parse(new TextDecoder().decode(p)).rec, false); } catch (e) { /* ignore */ }
  } else if (type === "P") {
    send("Q", p.slice());
  }
}

async function readLoop(c) {
  let buf = new Uint8Array(0);
  try {
    for (;;) {
      const chunk = await c.read();
      if (chunk === null) break;
      const joined = new Uint8Array(buf.length + chunk.length);
      joined.set(buf); joined.set(chunk, buf.length);
      buf = joined;
      while (buf.length >= 5) {
        const len = new DataView(buf.buffer, buf.byteOffset).getUint32(1, true);
        if (buf.length < 5 + len) break;
        handle(String.fromCharCode(buf[0]), buf.subarray(5, 5 + len));
        buf = buf.slice(5 + len);
      }
    }
  } catch (e) { if (conn === c) log(String(e.message || e)); }
  if (conn === c) disconnected("The DAW closed the connection.");
}

// ---- microphone ------------------------------------------------------------------------------------------
async function startAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC({ latencyHint: "interactive" });
  await ctx.resume();
  if (testTone) {
    // a 220 Hz tone instead of the microphone, for testing without one
    const osc = ctx.createOscillator(); osc.frequency.value = 220;
    const g = ctx.createGain(); g.gain.value = 0.3;
    osc.connect(g); source = g; osc.start();
  } else {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("This browser cannot use the microphone on this page (it needs a secure https address).");
    }
    const voice = $("voiceproc").checked;
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: voice, noiseSuppression: voice, autoGainControl: voice, channelCount: 1 } });
    source = ctx.createMediaStreamSource(stream);
  }
  proc = ctx.createScriptProcessor(4096, 1, 1);
  proc.onaudioprocess = (e) => {
    const x = e.inputBuffer.getChannelData(0);
    let pk = 0;
    for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > pk) pk = a; }
    level = Math.max(level * 0.85, pk);
    if (!conn) return;
    if (recording) {
      if (queued > 3_000_000) return; // the link cannot keep up: drop rather than pile up
      const pcm = new Int16Array(x.length);
      for (let i = 0; i < x.length; i++) pcm[i] = Math.max(-1, Math.min(1, x[i])) * 32767;
      send("A", new Uint8Array(pcm.buffer));
    } else {
      const now = performance.now();
      if (now - lastL > 100) { send("L", Uint8Array.of(Math.min(255, Math.round(pk * 255)))); lastL = now; }
    }
  };
  const mute = ctx.createGain(); mute.gain.value = 0;
  source.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
}

function stopAudio() {
  try { if (proc) proc.disconnect(); } catch (e) {}
  try { if (stream) stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
  try { if (ctx) ctx.close(); } catch (e) {}
  proc = stream = ctx = source = null;
}

// ---- connect / disconnect --------------------------------------------------------------------------------
function disconnected(msg) {
  if (conn) { try { conn.close(); } catch (e) {} }
  conn = null; queued = 0;
  setRecording(false, false);
  stopAudio();
  if (wake) { try { wake.release(); } catch (e) {} wake = null; }
  $("live").hidden = true; $("setup").hidden = false;
  $("connect").disabled = false;
  setStatus(msg || "Disconnected.", "bad");
}
function fail(e) { log(String((e && e.message) || e)); if (conn) disconnected("Connection lost."); }

$("connect").onclick = async () => {
  const addr = $("addr").value.trim();
  const port = parseInt($("port").value, 10) || 8765;
  if (!addr) { setStatus("Paste the address from your DAW first.", "bad"); return; }
  $("connect").disabled = true;
  try {
    setStatus(testTone ? "Starting test tone…" : "Allow the microphone when asked…");
    await startAudio();
    setStatus("Connecting to your DAW… this can take a few seconds.");
    const c = await tailcatDial({ addr, derpMapURL, port, verbose });
    conn = c;
    $("setup").hidden = true; $("live").hidden = false; $("rec").disabled = false;
    setStatus("Connected to your DAW. Ready.", "ok");
    send("H", enc.encode(JSON.stringify({ v: 1, rate: ctx.sampleRate, ua: navigator.userAgent.slice(0, 120) })));
    readLoop(c);
    try { wake = await navigator.wakeLock.request("screen"); } catch (e) { /* not available: keep the screen on yourself */ }
  } catch (e) {
    stopAudio();
    $("connect").disabled = false;
    setStatus("Could not connect: " + (e.message || e), "bad");
  }
};
$("rec").onclick = () => { if (conn) setRecording(!recording, true); };
$("disconnect").onclick = () => disconnected("Disconnected.");
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && conn && !wake) { try { wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
});

// ---- meter and clock -------------------------------------------------------------------------------------
setInterval(() => {
  $("meter").firstElementChild.style.width = Math.min(100, Math.round(level * 140)) + "%";
  if (recording) {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $("time").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  } else if (!conn) { $("time").textContent = "0:00"; }
}, 80);
</script>
</body>
</html>
